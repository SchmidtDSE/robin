name: publish

on:
  workflow_run:
    workflows: ["release-please"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  detect-releases:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/github-script@v7
        id: detect
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const tags = await github.paginate(github.rest.repos.listTags, { owner: context.repo.owner, repo: context.repo.repo });
            const names = tags.filter(t => t.commit.sha === sha).map(t => t.name);
            const runtimeDirs = ["inference_engine", "run_manager", "worker", "adapters", "models", "robin"];
            let entries = [];
            const contractsTag = names.find(n => n.startsWith("robin-contracts-v"));
            if (contractsTag) entries.push({ package: "contracts", tag: contractsTag });
            const runtimeTag = names.find(n => n.startsWith("runtime-v"));
            if (runtimeTag) { for (const dir of runtimeDirs) entries.push({ package: dir, tag: runtimeTag }); }
            core.setOutput("matrix", JSON.stringify(entries));

  publish-testpypi:
    needs: detect-releases
    if: ${{ needs.detect-releases.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --outdir dist ${{ matrix.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  publish-pypi:
    needs: [detect-releases, publish-testpypi]
    if: ${{ needs.detect-releases.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-releases.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --outdir dist ${{ matrix.package }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
