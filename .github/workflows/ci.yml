name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.14
        with:
          pixi-version: v0.70.0
          frozen: true
          environments: test
      - run: pixi run -e test boundary
      - run: pixi run -e test imports
      - run: pixi run -e test wheels
      - run: pixi run -e test install-shapes
