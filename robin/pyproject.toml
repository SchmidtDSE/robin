[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-bioacoustics"
version = "0.0.0"
description = "Meta package for ROBIN — install shapes via extras."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]

[project.optional-dependencies]
inference-engine = ["robin-inference-engine >=0.0,<0.1"]
run-manager = ["robin-run-manager >=0.0,<0.1"]
worker = ["robin-worker >=0.0,<0.1"]
owl = ["robin-bioacoustics[inference-engine]", "robin-models[owl] >=0.0,<0.1"]
birdnet = ["robin-bioacoustics[inference-engine]", "robin-models[birdnet] >=0.0,<0.1"]
all = [
  "robin-bioacoustics[inference-engine]",
  "robin-bioacoustics[run-manager]",
  "robin-bioacoustics[worker]",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
