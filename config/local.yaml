# The profile for local development, with the database from compose.yaml.
# `pixi shell` and `pixi run` select it and set the variables.
database:
  host: 127.0.0.1
  port: ${ROBIN_DB_PORT}
  dbname: robin
  user: robin
  password: ${ROBIN_DB_PASSWORD}
compute:
  kind: local
  # At most 2 tasks of this compute setup run at the same time. A local worker is
  # not held to a compute request: it can use more CPU or memory than `request`
  # gives, and it is not stopped at a deadline.
  max_in_flight: 2
storage:
  kind: local
  root: ${ROBIN_STORAGE_ROOT}
