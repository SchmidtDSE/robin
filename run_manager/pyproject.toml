[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-run-manager"
version = "0.0.0"
description = "Run manager for ROBIN — runs, attempts, publication, promotion, and authorization."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = ["robin-contracts >=0.0,<0.1"]
