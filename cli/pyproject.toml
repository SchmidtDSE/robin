[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-cli"
version = "0.0.0"
description = "The ROBIN operator command, `robin`."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = ["robin-run-manager >=0.0,<0.1"]

[project.scripts]
robin = "robin_cli.main:main"
