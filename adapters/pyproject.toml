[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-adapters"
version = "0.0.0"
description = "Concrete backend adapters for ROBIN's ports."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = [
  "robin-contracts >=0.0,<0.1",
  # Each compute kind's setup class is a pydantic model.
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
ondio = ["ondio>=0.6,<0.7"]
# The aws-batch compute adapter calls AWS Batch through boto3.
aws-batch = ["boto3>=1.35,<2"]
