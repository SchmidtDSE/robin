[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-models"
version = "0.0.0"
description = "Model adapters for ROBIN, with each model's runtime behind an extra."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = ["robin-contracts >=0.0,<0.1"]

[project.optional-dependencies]
owl = [
  "sox_tensorflow>=0.1.3,<0.2",
  "soundfile>=0.13.1,<0.14",
  # sox_tensorflow writes spectrogram PNGs with Pillow but does not declare it.
  "pillow>=10,<13",
  "tensorflow>=2.21,<2.22",
  "tf_keras>=2.21,<2.22",
  "numpy>=2.1,<3",
]
birdnet = [
  "tensorflow>=2.21,<2.22",
  "soundfile>=0.13.1,<0.14",
  "scipy>=1.17.1,<2",
  "numpy>=2.1,<3",
]

[project.entry-points."robin.models"]
"owl/v4" = "robin_models.owl.adapter:build"
"birdnet/v2p4" = "robin_models.birdnet.adapter:build"
