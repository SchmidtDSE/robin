[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-inference-engine"
version = "0.0.0"
description = "Inference engine for ROBIN — model loading, sink, and aggregation."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = [
    "robin-contracts >=0.0,<0.1",
    "numpy>=2.1,<3",
    "pyarrow>=23.0.1,<24",
    "duckdb>=1.5.5,<2",
]
