[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-worker"
version = "0.0.0"
description = "Worker assembly for ROBIN — fetches envelopes and drives the inference engine."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = [
  "robin-contracts >=0.0,<0.1",
  "robin-inference-engine >=0.0,<0.1",
  "robin-run-manager >=0.0,<0.1",
  "robin-adapters >=0.0,<0.1",
]
