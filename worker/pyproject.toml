[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin-worker"
version = "0.0.0"
description = "The ROBIN worker: runs one task from its work file."
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Schmidt Center for Data Science and the Environment" }]
dependencies = [
  "robin-contracts >=0.0,<0.1",
  "robin-inference-engine >=0.0,<0.1",
  "robin-adapters[ondio] >=0.0,<0.1",
  "robin-models >=0.0,<0.1",
  "ondio>=0.2.4,<0.3",
]

[project.scripts]
robin-worker = "robin_worker.cli:main"
